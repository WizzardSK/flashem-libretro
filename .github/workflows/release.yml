name: Build and release

# Asked for in issue #2. Started by hand rather than on every push: this is an
# emulator under active reverse engineering, and a release should be a moment
# someone chose, not a side effect of a commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release (e.g. v0.1)'
        type: string
        required: true
      release:
        description: 'Publish the builds as a release'
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            core: flashem_libretro.so
            ext: so
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            core: flashem_libretro.so
            ext: so
          - os: macos-15
            name: macos-arm64
            core: flashem_libretro.dylib
            ext: dylib
          - os: windows-2025
            name: windows-x86_64
            core: flashem_libretro.dll
            ext: dll
    steps:
      - uses: actions/checkout@main
        with:
          # dynarmic and its externals, for the JIT (Linux for now)
          submodules: ${{ runner.os == 'Linux' && 'recursive' || 'false' }}

      # The core needs nothing beyond a C compiler and libm.
      # MSYS2 rather than MSVC: the makefile is GNU make and the core is C,
      # so mingw-w64 builds it as it stands.
      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            zip

      # The ARM9's JIT (dynarmic) on Linux; the other platforms build the
      # interpreter alone for now
      - name: dynarmic (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev
          tools/build_dynarmic.sh build/dynarmic

      - name: Build the libretro core
        if: runner.os != 'Windows'
        run: |
          JIT=0; [ "$RUNNER_OS" = Linux ] && JIT=1
          make -f Makefile.libretro JIT=$JIT -j$(getconf _NPROCESSORS_ONLN)

      # -static so the .dll carries the MinGW runtime rather than asking the
      # person who downloads it to find matching MinGW runtimes.
      - name: Build the libretro core (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export LDFLAGS="-static"
          make -f Makefile.libretro platform=win -j$(nproc)

      # A core missing an entry point loads and then does nothing useful, which
      # is a confusing thing to hand someone. Split per platform: the question
      # has a different answer on PE than on ELF or Mach-O, and the Windows
      # steps need the msys2 shell.
      - name: Check the core exports what a frontend calls
        if: runner.os != 'Windows'
        run: |
          set -e
          test -f "${{ matrix.core }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            count=$(nm -gU "${{ matrix.core }}" | grep -c " T _retro_" || true)
          else
            count=$(nm -D --defined-only "${{ matrix.core }}" | grep -c " T retro_" || true)
          fi
          echo "retro_* entry points: $count"
          [ "$count" -ge 25 ]

      - name: Check the core exports what a frontend calls (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          test -f "${{ matrix.core }}"
          count=$(objdump -p "${{ matrix.core }}" | grep -c "retro_" || true)
          echo "retro_* entry points: $count"
          [ "$count" -ge 25 ]

      - name: Stage
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.core }}" "dist/flashem_libretro_${{ matrix.name }}.${{ matrix.ext }}"
          cp flashem_libretro.info dist/ 2>/dev/null || true

      - name: Stage (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp "${{ matrix.core }}" "dist/flashem_libretro_${{ matrix.name }}.${{ matrix.ext }}"
          cp flashem_libretro.info dist/ 2>/dev/null || true


      # The standalone emulator (issue #4): the SDL2 frontend, with the SDL2
      # library beside it on macOS and Windows, where it is not part of the
      # system. Linux takes the distribution's libsdl2.
      - name: SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev

      - name: SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Build the standalone emulator
        if: runner.os != 'Windows'
        run: make flashem -j$(getconf _NPROCESSORS_ONLN)

      - name: Build the standalone emulator (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make platform=win SDL2_PREFIX= flashem.exe -j$(nproc)

      - name: Stage the standalone emulator
        if: runner.os != 'Windows'
        run: |
          set -e
          mkdir -p standalone/flashem
          cp flashem standalone/flashem/
          if [ "$RUNNER_OS" = "macOS" ]; then
            # SDL2 beside the program, found through @executable_path
            sdl=$(otool -L flashem | awk '/libSDL2/{print $1; exit}')
            cp "$sdl" standalone/flashem/
            name=$(basename "$sdl")
            chmod u+w "standalone/flashem/$name"
            install_name_tool -id "@executable_path/$name" "standalone/flashem/$name"
            install_name_tool -change "$sdl" "@executable_path/$name" standalone/flashem/flashem
            codesign --force -s - "standalone/flashem/$name" standalone/flashem/flashem
            otool -L standalone/flashem/flashem
          fi
          (cd standalone && tar -czf "../dist/flashem-${{ matrix.name }}.tar.gz" flashem)

      - name: Stage the standalone emulator (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p standalone/flashem
          cp flashem.exe standalone/flashem/
          # every MinGW DLL it needs (SDL2 and what SDL2 itself links)
          for dll in $(ldd flashem.exe | awk '/\/mingw64\//{print $3}'); do
            cp "$dll" standalone/flashem/
          done
          ls standalone/flashem
          (cd standalone && zip -r "../dist/flashem-${{ matrix.name }}.zip" flashem)

      - uses: actions/upload-artifact@main
        with:
          name: flashem-${{ matrix.name }}
          path: dist/*
          compression-level: 0

  # Android, through the NDK the runner carries and jni/Android.mk. One core
  # per ABI; a frontend wants the file as flashem_libretro_android.so.
  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main

      - name: Build the libretro core
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" -C jni -j$(getconf _NPROCESSORS_ONLN) \
            APP_ABI="arm64-v8a armeabi-v7a x86_64 x86"

      - name: Check the cores export what a frontend calls
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            core="libs/$abi/libretro.so"
            test -f "$core"
            count=$("$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$core" | grep -c " T retro_" || true)
            echo "$abi retro_* entry points: $count"
            [ "$count" -ge 25 ]
          done

      - name: Stage
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "libs/$abi/libretro.so" "dist/flashem_libretro_android-$abi.so"
          done

      - uses: actions/upload-artifact@main
        with:
          name: flashem-android
          path: dist/*
          compression-level: 0

  release:
    name: Publish
    needs: [build, android]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main

      - uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          {
            echo "FlashEm, an emulator for the VTech V.Flash (V.Smile Pro)."
            echo
            echo "Games boot to their menus and 3D gameplay renders, with movies and sound, on a model of the real hardware. Still under active reverse engineering: compatibility is not complete - see the status section in the README for where the work stands."
            echo
            echo "**libretro core** - drop \`flashem_libretro_<platform>.so\` (or \`.dylib\`, \`.dll\`) into your frontend's \`cores\` directory, and \`flashem_libretro.info\` into its \`info\` directory. On Android take the file for your device's ABI (arm64-v8a for most phones) and name it \`flashem_libretro_android.so\`. It takes \`.cue\`, \`.bin\` and \`.iso\`."
            echo
            echo "**Standalone** - \`flashem-<platform>\` (\`.tar.gz\`, \`.zip\` on Windows) is the emulator on its own, with SDL2. Put the boot ROM \`70004.bin\` beside \`flashem\` (\`flashem.exe\`) and start it: it asks for a disc (\`.cue\`, \`.bin\`, \`.iso\`), or takes one on the command line or dropped on its window; O opens another. Keys: arrows = stick, Z/X/C/V = red/yellow/green/blue, Enter = OK, Backspace = Exit, F11 = fullscreen, Esc = quit (\`flashem --help\` lists the rest). On Linux it needs SDL2 (\`libsdl2-2.0-0\` on Debian/Ubuntu) and, for the disc picker, zenity or kdialog."
            echo
            echo "No save states: the emulator has no serialiser yet, so rewind, run-ahead and netplay are out until it grows one."
            echo
            # What is new: the newest section of the changelog
            echo "**What's new**"
            echo
            awk '/^## /{n++; next} n==1' CHANGELOG.md
            echo
            echo "The full list is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)."
            echo
            echo "Commit: $(git rev-parse --short=8 HEAD)"
          } > notes.md
          # One release, always the newest. This is pre-release software and a
          # row of stale tags - each with a set of cores nobody wants any more -
          # helps no one, and a link handed to someone in an issue should keep
          # pointing at something current rather than at whatever was newest the
          # day it was posted. Re-publishing the same tag replaces it in place.
          for old in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            echo "removing previous release $old"
            gh release delete "$old" --yes --cleanup-tag || true
          done

          gh release create "${{ inputs.tag }}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "FlashEm ${{ inputs.tag }}" \
            --notes-file notes.md
