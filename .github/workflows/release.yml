name: Build and release

# Asked for in issue #2. Started by hand rather than on every push: this is an
# emulator under active reverse engineering, and a release should be a moment
# someone chose, not a side effect of a commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release (e.g. v0.1)'
        type: string
        required: true
      release:
        description: 'Publish the builds as a release'
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            core: flashem_libretro.so
            ext: so
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            core: flashem_libretro.so
            ext: so
          - os: macos-15
            name: macos-arm64
            core: flashem_libretro.dylib
            ext: dylib
    steps:
      - uses: actions/checkout@main

      # libjpeg is the MJP decoder's; SDL2 is the standalone frontend's, and the
      # core is built without it (FLASHEM_NO_SDL).
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjpeg-dev libsdl2-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo sdl2

      # Homebrew keeps jpeg-turbo keg-only, so its headers are not on the
      # default search path and the MJP decoder stops at jpeglib.h. The
      # makefiles append to CFLAGS rather than setting it, so the environment
      # is the way in; a command-line assignment would replace their flags.
      - name: Point the compiler at Homebrew's jpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix=$(brew --prefix jpeg-turbo)
          echo "CFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"

      - name: Build the libretro core
        run: make -f Makefile.libretro -j$(getconf _NPROCESSORS_ONLN)

      # Worth building too: the person who asked for releases wants something to
      # run, and not everyone runs a libretro frontend.
      - name: Build the standalone
        run: make -j$(getconf _NPROCESSORS_ONLN) flashem || echo "standalone build failed - core still published"

      # A core that is missing an entry point loads and then does nothing
      # useful, which is a confusing thing to hand someone.
      - name: Check the core exports what a frontend calls
        run: |
          set -e
          test -f "${{ matrix.core }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            count=$(nm -gU "${{ matrix.core }}" | grep -c " T _retro_" || true)
          else
            count=$(nm -D --defined-only "${{ matrix.core }}" | grep -c " T retro_" || true)
          fi
          echo "retro_* entry points: $count"
          [ "$count" -ge 25 ]

      - name: Stage
        run: |
          mkdir -p dist
          cp "${{ matrix.core }}" "dist/flashem_libretro_${{ matrix.name }}.${{ matrix.ext }}"
          cp flashem_libretro.info dist/ 2>/dev/null || true
          if [ -f flashem ]; then cp flashem "dist/flashem_${{ matrix.name }}"; fi

      - uses: actions/upload-artifact@main
        with:
          name: flashem-${{ matrix.name }}
          path: dist/*
          compression-level: 0

  release:
    name: Publish
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main

      - uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          {
            echo "FlashEm, an emulator for the VTech V.Flash (V.Smile Pro)."
            echo
            echo "Early and honest about it: discs boot, the MJP video decodes, and no game is playable yet - see the status section in the README for where the work stands."
            echo
            echo "**libretro core** - drop \`flashem_libretro_<platform>.so\` (or \`.dylib\`) into your frontend's \`cores\` directory, next to \`flashem_libretro.info\`. It takes \`.cue\`, \`.bin\` and \`.iso\`."
            echo
            echo "**Standalone** - \`flashem_<platform>\`, an SDL2 window; run it with a disc image as its argument."
            echo
            echo "No save states: the emulator has no serialiser yet, so rewind, run-ahead and netplay are out until it grows one."
            echo
            echo "Commit: $(git rev-parse --short=8 HEAD)"
          } > notes.md
          gh release create "${{ inputs.tag }}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "FlashEm ${{ inputs.tag }}" \
            --notes-file notes.md
